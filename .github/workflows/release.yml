name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm test

      - run: npm run typecheck

      - run: npm run build:binary -- --all

      - name: Check the Linux x64 executable runs
        run: test "v$(bin/clozemaster-linux-x64 --version)" = "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  # Every platform's old build updates itself to this release before anyone else gets it.
  check-self-update:
    needs: build
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      # Artifacts lose the executable bit.
      - run: chmod +x bin/clozemaster-*

      - run: sh scripts/check-self-update.sh "${GITHUB_REF_NAME#v}"

  publish:
    needs: [build, check-self-update]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      # A full release, not a draft or prerelease: install.sh and the update check read releases/latest.
      # Artifacts lose the executable bit, but install.sh sets it after downloading.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bin/clozemaster-darwin-arm64 \
            bin/clozemaster-darwin-x64 \
            bin/clozemaster-linux-x64 \
            bin/clozemaster-linux-arm64 \
            bin/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest
